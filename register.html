<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Community Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .bg-primary {
            background-color: #8B4513;
        }

        .bg-secondary {
            background-color: #DEB887;
        }

        .text-primary {
            color: #8B4513;
        }

        .hover-primary:hover {
            background-color: #A0522D;
        }

        .border-primary {
            border-color: #8B4513;
        }

        /* Background image for the entire page */
        body {
            background-image: url('/images/register-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Enhanced styling for registration container */
        .register-container {
            background: linear-gradient(to right, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.95));
            border: 1px solid #8B4513;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        .register-container:hover {
            transform: translateY(-5px);
        }

        .register-btn {
            background-color: #8B4513;
            color: white;
            padding: 0.75rem;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .register-btn:hover {
            background-color: #A0522D;
            transform: scale(1.05);
        }

        input,
        select {
            border-radius: 6px;
            border: 1px solid #ddd;
            padding: 0.5rem;
            width: 100%;
            transition: box-shadow 0.3s ease;
        }

        input:focus,
        select:focus {
            box-shadow: 0 0 5px rgba(139, 69, 19, 0.5);
            border-color: #8B4513;
        }

        /* Error message styling */
        .error-message {
            color: red;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
    </style>
</head>

<body class="bg-gray-50">
    <nav class="bg-primary text-white shadow-lg">
        <div class="container mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-bold">Community</a>
            <div class="hidden md:flex items-center space-x-8">
                <a href="index.html" class="hover:text-gray-200">Home</a>
                <a href="about.html" class="hover:text-gray-200">About</a>
                <a href="services.html" class="hover:text-gray-200">Services</a>
                <a href="contact.html" class="hover:text-gray-200">Contact</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-6 py-12">
        <h1 class="text-4xl font-bold text-primary text-center mb-8">Register Now</h1>
        <div class="max-w-lg mx-auto register-container">
            <form id="registerForm">
                <div class="mb-6">
                    <label for="username" class="block text-gray-700 mb-2">Username</label>
                    <input type="text" id="username" name="username" required
                        class="border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none"
                        placeholder="Enter your username">
                    <p class="error-message" id="usernameError"></p>
                </div>
                <div class="mb-6">
                    <label for="email" class="block text-gray-700 mb-2">Email</label>
                    <input type="email" id="email" name="email" required
                        class="border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none"
                        placeholder="Enter your email">
                    <p class="error-message" id="emailError"></p>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" name="password" required
                        class="border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none"
                        placeholder="Enter a password">
                    <p class="error-message" id="passwordError"></p>
                </div>
                <div class="mb-6">
                    <label for="mobile" class="block text-gray-700 mb-2">Mobile Number</label>
                    <input type="text" id="mobile" name="mobile_number"
                        class="border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none"
                        placeholder="Optional">
                    <p class="error-message" id="mobileError"></p>
                </div>
                <div class="mb-6">
                    <label for="role" class="block text-gray-700 mb-2">Role</label>
                    <select id="role" name="role"
                        class="border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none">
                        <option value="member">Member</option>
                        <option value="pastor">Pastor</option>
                    </select>
                </div>
                <button type="submit" class="w-full register-btn text-center font-semibold hover:bg-opacity-90">
                    Register
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function (e) {
            e.preventDefault();

            // Clear previous error messages
            document.getElementById("usernameError").innerText = "";
            document.getElementById("emailError").innerText = "";
            document.getElementById("passwordError").innerText = "";
            document.getElementById("mobileError").innerText = "";

            // Input values
            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const mobile = document.getElementById("mobile").value;

            let isValid = true;

            // Username validation: minimum 3 characters, alphanumeric
            if (!/^[a-zA-Z0-9]{3,}$/.test(username)) {
                document.getElementById("usernameError").innerText = "Username must be at least 3 characters long and alphanumeric.";
                isValid = false;
            }

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById("emailError").innerText = "Please enter a valid email address.";
                isValid = false;
            }

            // Password validation: minimum 6 characters
            if (password.length < 6) {
                document.getElementById("passwordError").innerText = "Password must be at least 6 characters long.";
                isValid = false;
            }

            // Mobile number validation: Indian number format
            const mobileRegex = /^[6-9]\d{9}$/;
            if (mobile && !mobileRegex.test(mobile)) {
                document.getElementById("mobileError").innerText = "Please enter a valid 10-digit Indian mobile number.";
                isValid = false;
            }

            // If all validations pass, submit the form
            if (isValid) {
                // Demo only — no backend. Show a success message instead of calling an API.
                alert("Thank you for registering! (This is a demo — no data is stored.)");
                window.location.href = "complete.html";
            }
        });
    </script>
</body>

</html>
